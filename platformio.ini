; OpenAEDTrainer - open source AED trainer board
; Ai-Thinker ESP32 Audio Kit v2.2 (A436, ESP32-A1S, ES8388)
;
;   pio run -t upload        build + flash firmware
;   pio run -t uploadfs      flash the audio files in sdcard/ to internal flash
;   pio device monitor
;
; Two environments:
;   audiokit     (default) audio is read from internal flash (LittleFS)
;   audiokit-sd  audio is read from the micro-SD card (SD_MMC 1-bit)
;                DIP switches: 1 ON, 2 OFF, 3 ON, 4 OFF, 5 OFF
;                GPIO 2/14/15 are taken by the SD card, so the optional
;                LEDs on 14/15 are disabled (see include/pins.h)

[platformio]
default_envs = audiokit
data_dir = sdcard

[env]
platform = espressif32@7.1.3
board = esp32dev
framework = arduino
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
board_build.f_flash = 80000000L
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600
extra_scripts = pre:scripts/embed_web.py
lib_deps =
    https://github.com/pschatzmann/arduino-audio-tools.git#v1.2.6
    https://github.com/pschatzmann/arduino-audio-driver.git#v0.3.1
    https://github.com/pschatzmann/codec-helix.git#v0.9.4
    https://github.com/ESP32Async/AsyncTCP.git#v3.5.0
    https://github.com/ESP32Async/ESPAsyncWebServer.git#v3.12.1
    bblanchon/ArduinoJson@^7.4.2
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17  ; arduino-audio-driver needs C++17 (inline static constexpr)
    -DCORE_DEBUG_LEVEL=3
    ; Helix only decodes once it holds MP3_MIN_FRAME_SIZE bytes (default 1024)
    ; and the rest of each file is lost. Must stay above ~2 frames (64 kbps
    ; at 22 kHz = ~210 bytes/frame) or partial frames get dropped mid-file.
    ; At most ~64 ms is lost at the end, covered by the files' silence padding.
    -DMP3_MIN_FRAME_SIZE=512
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue

[env:audiokit]

[env:audiokit-sd]
build_flags =
    ${env.build_flags}
    -DAUDIO_FROM_SD=1
